:500;display:inline-flex;align-items:center;gap:8px}.row-sub{font-size:11px;color:var(--muted);margin-top:2px}.num{font-weight:500}.class-table td{height:47px}.progress-cell{display:flex;align-items:center;gap:10px}.progress-cell .track{width:98px}.progress-cell .percent{font-size:11px;color:var(--muted);width:32px}.arrow{color:#9b9b9b;font-size:16px}.table-foot{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;font-size:12px;color:var(--muted)}.table-foot strong{color:var(--ink);font-weight:600}.recent-list{padding:16px 24px 12px}.recent-item{display:block;border-bottom:1px solid var(--border);padding:12px 0}.recent-item:first-child{padding-top:0}.recent-item:last-child{border-bottom:0}.recent-item:hover .row-title{color:var(--blue)}.recent-top,.recent-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}.recent-meta{margin-top:5px;color:var(--muted);font-size:11px}.time{font-size:11px;color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}.badge.ready{background:var(--blue-tint);color:var(--blue)}.badge.cooking{background:var(--warm);color:var(--warm-ink)}.badge.new{background:var(--neutral);color:var(--muted)}.footnote{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.filter-bar{display:flex;gap:12px;align-items:center;padding:18px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}.tabs{display:flex;gap:22px;align-items:center}.tab{display:inline-flex;gap:6px;padding:9px 0;border-bottom:2px solid transparent;font-size:13px;color:var(--muted)}.tab.selected{color:var(--blue);border-bottom-color:var(--blue)}.tab-count{font-size:12px}.search{margin-left:auto;display:flex;gap:8px}.search input{height:36px;min-width:180px;width:210px;border:1px solid var(--border);border-radius:8px;padding:0 12px;color:var(--ink);background:white}.small-button{height:36px;p el{background:var(--warm);padding:24px;border-radius:12px}.warm-panel .large-quantity{margin:12px 0}.warm-panel p{color:var(--warm-ink);font-size:13px;margin:8px 0 0}.timeline{list-style:none;padding:22px 24px 24px;margin:0;display:flex;flex-direction:column}.timeline li{display:flex;gap:16px;padding-bottom:24px;position:relative}.timeline li:last-child{padding-bottom:0}.timeline li:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:1px;background:var(--border)}.timeline-dot{width:32px;height:32px;background:var(--neutral);border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:14px;color:var(--muted)}.timeline li.complete .timeline-dot{background:var(--blue-tint);color:var(--blue)}.timeline h3{font-size:14px;margin:4px 0}.timeline p{font-size:12px;color:var(--muted);margin:4px 0}.timeline-time{margin-left:auto;font-size:12px;color:var(--muted);padding-top:5px}.links-list{display:flex;flex-direction:column;gap:12px}.links-list a{display:flex;justify-content:space-between;align-items:center;color:var(--blue);font-size:13px}.empty{padding:64px 24px;text-align:center}.empty h2{font-size:22px;margin:0 0 8px}.empty p{color:var(--muted);margin:0 0 20px}.entity-name{font-size:24px;font-weight:600;letter-spacing:-.6px;margin:0}.entity-caption{font-size:13px;color:var(--muted);margin-top:6px}.text-link{color:var(--blue)}.text-link:hover{text-decoration:underline}

<body>
<div id="screen"></div>
<script>
'use strict';
class AnalyticsData {
  #records;
  #dishes = Object.freeze({soup:'Куриный суп с лапшой',cutlet:'Котлета с гречкой',casserole:'Творожная запеканка'});
  #groups = Object.freeze({'9a':'9А','10b':'10Б','8v':'8В','7a':'7А'});
  get dishes(){return this.#dishes;}
  get groups(){return this.#groups;}
  constructor() {
    const records = [];
    const add = (id,dish,group,qty,date,time,status,ready) => records.push(Object.freeze({id:String(id),dish,group,qty,date,created:time,status,cooking:status==='new'?null:this.addMinutes(time,2),ready:ready||null}));
    const history = [
      ['2026-10-13',[['soup','9a',24],['cutlet','9a',32],['soup','10b',16],['cutlet','10b',34],['casserole','8v',36],['soup','7a',30],['casserole','7a',14]]],
      ['2026-10-14',[['soup','9a',44],['cutlet','9a',20],['soup','10b',36],['cutlet','10b',20],['casserole','8v',44],['cutlet','7a',34],['casserole','7a',14]]],
      ['2026-10-15',[['soup','9a',20],['cutlet','9a',38],['soup','10b',22],['cutlet','10b',32],['casserole','8v',40],['soup','7a',30],['casserole','7a',16]]],
      ['2026-10-16',[['soup','9a',32],['cutlet','9a',32],['soup','10b',48],['casserole','10b',10],['cutlet','8v',24],['casserole','8v',24],['cutlet','7a',22],['casserole','7a',32]]]
    ];
    let id=1200;
    for(const [date,rows] of history) rows.forEach(([dish,group,qty],index)=>{const time=this.addMinutes('08:30',index*17);add(id++,dish,group,qty,date,time,'ready',this.addMinutes(time,10));});
    for(const [date,dish,group,qty,status] of [
      ['2026-10-13','soup','9a',22,'cooking'],['2026-10-14','cutlet','10b',20,'new'],
      ['2026-10-15','soup','8v',14,'cooking'],['2026-10-15','cutlet','8v',16,'new'],
      ['2026-10-15','casserole','8v',4,'cooking'],['2026-10-16','casserole','7a',22,'new']
    ]) add(id++,dish,group,qty,date,'11:30',status);
    for(const row of [
      [1251,'casserole','9a',26,'11:40','new'],[1250,'cutlet','7a',26,'11:25','cooking'],[1249,'soup','8v',20,'11:15','cooking'],
      [1248,'soup','9a',32,'10:20','ready','10:28'],[1247,'cutlet','10b',26,'10:00','ready','10:12'],
      [1246,'casserole','8v',18,'09:30','ready','09:42'],[1245,'soup','7a',30,'09:20','ready','09:28'],
      [1244,'cutlet','9a',36,'09:10','ready','09:22'],[1243,'casserole','10b',32,'08:50','ready','08:58']
    ]) add(row[0],row[1],row[2],row[3],'2026-10-19',row[4],row[5],row[6]);
    this.#records=Object.freeze(records);
  }
  addMinutes(time,amount){const [h,m]=time.split(':').map(Number);const n=h*60+m+amount;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
  scope(state){return this.#records.filter(r=>state.period==='week'?(r.date>='2026-10-13'&&r.date<='2026-10-19'):r.date===state.date);}
  record(id){return this.#records.find(r=>r.id===String(id));}
  filter(state,extra={}) {
    const f=Object.assign({},state,extra);
    return this.scope(f).filter(r=>{
      if(f.dish&&r.dish!==f.dish)return false;
      if(f.group&&r.group!==f.group)return false;
      if(f.status&&f.status!=='all'&&(f.status==='pending'?r.status==='ready':r.status!==f.status))return false;
      if(f.hour&&(!r.ready||r.ready.slice(0,2)!==f.hour))return false;
      if(f.on&&r.date!==f.on)return false;
      if(f.q&&!([this.dishes[r.dish],this.groups[r.group],r.id].join(' ').toLocaleLowerCase('ru').includes(f.q.toLocaleLowerCase('ru'))))return false;
      return true;
    }).sort((a,b)=>f.sort==='qty'?b.qty-a.qty:f.sort==='qty-asc'?a.qty-b.qty:b.date.localeCompare(a.date)||b.created.localeCompare(a.created)||Number(b.id)-Number(a.id));
  }
  totals(rows){return rows.reduce((a,r)=>({planned:a.planned+r.qty,issued:a.issued+(r.status==='ready'?r.qty:0),orders:a.orders+1,ready:a.ready+(r.status==='ready'?1:0)}),{planned:0,issued:0,orders:0,ready:0});}
  breakdown(rows,key){const labels=key==='dish'?this.dishes:this.groups;return Object.entries(labels).map(([id,label])=>Object.assign({id,label},this.totals(rows.filter(r=>r[key]===id)))).filter(r=>r.orders);}
}
class AnalyticsView {
  constructor(data){this.data=data;}
  escape(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  portions(n){const a=Math.abs(n)%100,b=a%10;return n+' '+(a>10&&a<20?'порций':b===1?'порция':b>=2&&b<=4?'порции':'порций');}
  date(date,short=false){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:short?'short':'long',...(short?{}:{year:'numeric'})}).format(new Date(date+'T12:00:00')).replace(' г.','');}
  url(path,params={}){const values=Object.assign({period:this.state.period,date:this.state.date},params);delete values.path;const query=new URLSearchParams(values);for(const [k,v]of Array.from(query))if(v===''||v==='all'||v==='undefined')query.delete(k);return '#/'+path+'?'+query.toString();}
  badge(status){const text={ready:'Готово',cooking:'Готовится',new:'Новый'};return '<span class="badge '+status+'"><span aria-hidden="true">'+({ready:'✓',cooking:'◷',new:'○'}[status])+'</span>'+text[status]+'</span>';}
  render(state){
    this.state=state;
    const path=state.path.split('/'),page=path[0];let content;
    if(page==='overview')content=this.overview();
    else if(page==='orders')content=this.orders();
    else if(page==='dish')content=this.entity('dish',path[1]);
    else if(page==='group')content=this.entity('group',path[1]);
    else if(page==='order')content=this.order(path[1]);
    else content=this.notFound();
    return this.header(page)+'<main class="main" id="main">'+content+'</main>';
  }
  header(page){return '<header class="app-header"><a class="brand" href="'+this.url('overview')+'"><img src="./assets/L3lxuA.png" alt=""><span>Столовая</span></a><span class="role">Рабочее место администратора</span><nav class="main-nav" aria-label="Основные разделы"><a class="'+(page==='overview'?'active':'')+'" href="'+this.url('overview')+'">Обзор</a><a class="'+(page==='orders'?'active':'')+'" href="'+this.url('orders')+'">Заказы</a></nav><div class="profile"><span class="demo">Пример данных</span><span class="avatar">АМ</span><span class="user-name">Анна М.</span><span aria-hidden="true">⌄</span></div></header>';}
  controls(){const s=this.state;let date='<span class="date-control date-text">13–19 октября 2026</span>';if(s.period==='day'){date='<select class="date-control" data-filter="date" aria-label="Дата статистики">';for(let day=13;day<=19;day++){const value='2026-10-'+day;date+='<option value="'+value+'" '+(s.date===value?'selected':'')+'>'+this.date(value)+'</option>';}date+='</select>';}return '<div class="period-controls"><div class="segmented" aria-label="Период"><a class="'+(s.period==='day'?'selected':'')+'" href="'+this.url(s.path,Object.assign({},s,{period:'day',hour:'',on:'',page:1}))+'">День</a><a class="'+(s.period==='week'?'selected':'')+'" href="'+this.url(s.path,Object.assign({},s,{period:'week',hour:'',on:'',page:1}))+'">Неделя</a></div>'+date+'</div>';}
  heading(title,subtitle){return '<div class="page-head"><div><h1 class="page-title">'+this.escape(title)+'</h1><p class="subtitle">'+this.escape(subtitle)+'</p></div>'+this.controls()+'</div>';}
  back(label='К общей статистике',path='overview'){return '<a class="back" href="'+this.url(path)+'">← '+this.escape(label)+'</a>';}
  crumbs(label){return '<nav class="crumbs" aria-label="Путь страницы"><a href="'+this.url('overview')+'">Статистика</a><span>›</span><span>'+this.escape(label)+'</span></nav>';}
  metrics(rows,params={}){const t=this.data.totals(rows),ratio=t.planned?Math.round(t.issued/t.planned*100):0;const cells=[
    ['issued','Выдано порций',t.issued,'Заказы со статусом «Готово»','ready',true],
    ['planned','Запланировано',t.planned,'Порций на выбранный период','all',false],
    ['pending','Осталось приготовить',t.planned-t.issued,'Новые и готовящиеся заказы','pending',false],
    ['orders','Готово заказов',t.ready+' / '+t.orders,'Посмотреть готовые заказы','ready',false]
    ];return '<section class="stats" aria-label="Итоги периода">'+cells.map(([id,label,value,sub,status,primary])=>'<a data-metric="'+id+'" class="metric '+(primary?'primary':'')+'" href="'+this.url('orders',Object.assign({},params,{status}))+'"><span class="metric-arrow" aria-hidden="true">↗</span><span class="metric-label">'+label+'</span><span class="metric-value">'+value+(primary?'<small>'+ratio+'% от плана</small>':'')+'</span><span class="metric-context">'+sub+'</span></a>').join('')+'</section>';}
  overview(){
    const rows=this.data.scope(this.state);
    const heading=this.heading('Статистика питания',this.state.period==='week'?'13–19 октября 2026 · все показатели связаны с заказами':this.date(this.state.date)+' · данные рабочего места повара');
    if(!rows.length){
      return heading+this.metrics(rows)+'<section class="panel empty"><h2>В этот день заказов нет</h2><p>Выберите другую дату или откройте статистику за неделю.</p><a class="small-button" href="'+this.url('overview',{period:'week'})+'">За неделю</a></section>'+this.footnote();
    }
    return heading+this.metrics(rows)+'<div class="grid">'+this.chart(rows)+this.dishes(rows)+'</div><div class="grid">'+this.groups(rows)+this.recent(rows)+'</div>'+this.footnote();
  }
  footnote(){return '<div class="footnote"><span aria-hidden="true">ⓘ</span><span>«Выдано» — порции из заказов со статусом «Готово». Новые и готовящиеся заказы входят только в план.</span></div>';}
  chart(rows){let cols=[];if(this.state.period==='week'){for(let d=13;d<=19;d++){const date='2026-10-'+d;cols.push({label:new Intl.DateTimeFormat('ru-RU',{weekday:'short'}).format(new Date(date+'T12:00:00'))+', '+d,value:this.data.totals(rows.filter(r=>r.date===date)).issued,params:{on:date}});}}else{for(let h=8;h<=14;h++){const hour=String(h).padStart(2,'0');cols.push({label:hour+':00',value:this.data.totals(rows.filter(r=>r.status==='ready'&&r.ready.startsWith(hour))).issued,params:{hour}});}}const max=Math.max(1,...cols.map(r=>r.value));return '<section class="panel chart-panel"><div class="panel-head"><h2><a class="chart-title" href="'+this.url('orders',{status:'ready'})+'">'+(this.state.period==='week'?'Выдача за неделю':'Выдача по времени')+' <span class="arrow">›</span></a></h2><span class="legend">Выдано порций</span></div><p class="panel-description" style="padding:0 24px">По времени отметки «Готово»</p><div class="plot">'+cols.map(r=>'<a class="plot-column" title="'+r.label+': '+r.value+' порций" href="'+this.url('orders',Object.assign({status:'ready'},r.params))+'"><span class="plot-value">'+r.value+'</span><span class="plot-bar '+(!r.value?'zero':'')+'" style="height:'+Math.max(2,r.value/max*106)+'px"></span><span class="plot-label">'+r.label+'</span></a>').join('')+'</div></section>';}
  dishes(rows){return '<section class="panel dish-panel"><div class="panel-head"><h2>По блюдам</h2><a class="panel-link" href="'+this.url('orders')+'">Все заказы ›</a></div><p class="panel-description" style="padding:0 24px">Выдано / запланировано порций</p><div class="dish-list">'+this.data.breakdown(rows,'dish').map((r,i)=>'<a class="dish-item" href="'+this.url('dish/'+r.id)+'"><div class="dish-line"><span class="dish-name">'+r.label+'</span><span class="fraction">'+r.issued+' / '+r.planned+' ›</span></div><div class="track"><div class="fill '+(!i?'strong':'')+'" style="width:'+(r.issued/r.planned*100)+'%"></div></div></a>').join('')+'</div></section>';}
  groups(rows){const list=this.data.breakdown(rows,'group'),t=this.data.totals(rows);return '<section class="panel"><div class="panel-head" style="padding-bottom:18px"><h2>По классам и группам</h2><span class="fraction">'+list.length+' класса и группы</span></div><div class="table-wrap"><table class="class-table"><colgroup><col><col style="width:94px"><col style="width:94px"><col style="width:94px"><col style="width:178px"></colgroup><thead><tr><th>Класс / группа</th><th>Выдано</th><th>План</th><th>Осталось</th><th>Выполнено</th></tr></thead><tbody>'+list.map(r=>'<tr class="click-row" data-route="'+this.url('group/'+r.id)+'"><td><a class="row-title" href="'+this.url('group/'+r.id)+'">'+r.label+' <span class="arrow">›</span></a></td><td class="num">'+r.issued+'</td><td>'+r.planned+'</td><td>'+ (r.planned-r.issued)+'</td><td><div class="progress-cell"><div class="track"><div class="fill '+(r.issued===r.planned?'strong':'')+'" style="width:'+(r.issued/r.planned*100)+'%"></div></div><span class="percent">'+Math.round(r.issued/r.planned*100)+'%</span></div></td></tr>').join('')+'</tbody></table></div><div class="table-foot"><strong>Всего: '+t.issued+' из '+t.planned+' порций</strong><span>Нажмите на класс для деталей</span></div></section>';}
  recent(rows){return '<section class="panel"><div class="panel-head"><h2>Последние заказы</h2><a class="panel-link" href="'+this.url('orders')+'">Все ›</a></div><p class="panel-description" style="padding:0 24px">Из рабочего места повара</p><div class="recent-list">'+rows.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created)).slice(0,3).map(r=>'<a class="recent-item" href="'+this.url('order/'+r.id)+'"><div class="recent-top"><span class="row-title">'+this.data.dishes[r.dish]+'</span><span class="time">'+r.created+'</span></div><div class="recent-meta"><span>'+this.data.groups[r.group]+' · '+this.portions(r.qty)+' · #'+r.id+'</span>'+this.badge(r.status)+'</div></a>').join('')+'</div></section>';}
  orderTable(rows,compact=false){const s=this.state,pageSize=10,page=compact?1:Math.min(Math.max(1,s.page),Math.max(1,Math.ceil(rows.length/pageSize))),shown=compact?rows:rows.slice((page-1)*pageSize,page*pageSize);if(!rows.length)return '<div class="empty"><h2>Заказы не найдены</h2><p>Попробуйте изменить фильтры или поисковый запрос.</p><a class="small-button" href="'+this.url('orders')+'">Сбросить фильтры</a></div>';let html='<div class="table-wrap"><table class="orders-table"><colgroup><col><col style="width:116px"><col style="width:90px"><col style="width:124px"><col style="width:130px"><col style="width:98px"></colgroup><thead><tr><th>Блюдо</th><th>Класс / группа</th><th><button class="sort" data-sort="'+(s.sort==='qty'?'qty-asc':'qty')+'">Порции ↕</button></th><th>Добавлено</th><th>Статус</th><th>Готово в</th></tr></thead><tbody>';html+=shown.map(r=>'<tr class="click-row" data-route="'+this.url('order/'+r.id)+'"><td><a class="row-title" href="'+this.url('order/'+r.id)+'">'+this.data.dishes[r.dish]+' <span class="arrow">›</span></a><div class="row-sub">#'+r.id+'</div></td><td><a class="text-link" href="'+this.url('group/'+r.group)+'">'+this.data.groups[r.group]+'</a></td><td class="num">'+r.qty+'</td><td>'+r.created+(s.period==='week'?'<div class="row-sub">'+this.date(r.date,true)+'</div>':'')+'</td><td>'+this.badge(r.status)+'</td><td class="time">'+(r.ready||'—')+'</td></tr>').join('');html+='</tbody></table></div><div class="table-foot"><span>'+(compact?rows.length+' заказов':((page-1)*pageSize+1)+'–'+Math.min(rows.length,page*pageSize)+' из '+rows.length)+' · '+this.data.totals(rows).planned+' порций</span>';if(!compact&&rows.length>pageSize){html+='<nav class="pagination" aria-label="Страницы заказов">';for(let i=1;i<=Math.ceil(rows.length/pageSize);i++)html+='<a class="'+(page===i?'selected':'')+'" href="'+this.url('orders',Object.assign({},s,{page:i}))+'">'+i+'</a>';html+='</nav>';}return html+'</div>';}
  tabs(rows){const counts={all:rows.length,ready:rows.filter(r=>r.status==='ready').length,cooking:rows.filter(r=>r.status==='cooking').length,new:rows.filter(r=>r.status==='new').length};return '<div class="tabs">'+Object.entries({all:'Все',ready:'Готово',cooking:'Готовятся',new:'Новые'}).map(([id,label])=>'<a class="tab '+((this.state.status||'all')===id?'selected':'')+'" href="'+this.url('orders',Object.assign({},this.state,{status:id,page:1}))+'">'+label+' <span class="tab-count">'+counts[id]+'</span></a>').join('')+'</div>';}
  select(key,label,options){return '<select class="filter-select" data-filter="'+key+'" aria-label="'+label+'"><option value="">'+label+'</option>'+Object.entries(options).map(([id,name])=>'<option value="'+id+'" '+(this.state[key]===id?'selected':'')+'>'+name+'</option>').join('')+'</select>';}
  orders(){const rows=this.data.filter(this.state),t=this.data.totals(rows),s=this.state;const active=[s.group,s.dish,s.q,s.hour,s.on,s.status&&s.status!=='all'].some(Boolean);let chips='';if(s.status==='pending')chips+='<span class="applied">Новые и готовящиеся</span>';if(s.hour)chips+='<span class="applied">Выдано в '+this.escape(s.hour)+':00–'+this.escape(s.hour)+':59</span>';if(s.on)chips+='<span class="applied">'+this.date(s.on)+'</span>';return this.crumbs('Заказы')+this.heading('Заказы и выданные порции','Подробные записи по выбранным фильтрам')+'<section class="panel"><div class="filter-bar">'+this.tabs(this.data.scope(s))+'<form class="search" id="search-form"><input name="q" aria-label="Найти блюдо, класс или заказ" value="'+this.escape(s.q)+'" placeholder="Блюдо, класс или № заказа"><button class="small-button" type="submit">Найти</button></form></div><div class="filters-sub">'+this.select('dish','Все блюда',this.data.dishes)+this.select('group','Все классы и группы',this.data.groups)+chips+(active?'<a class="clear" href="'+this.url('orders')+'">Сбросить фильтры</a>':'')+'</div>'+this.orderTable(rows)+'</section><div class="footnote"><span>По фильтрам: <strong>'+t.issued+'</strong> порций выдано из <strong>'+t.planned+'</strong>. Нажмите на заказ, чтобы посмотреть состав и историю.</span></div>';}
  entity(key,id){const labels=key==='dish'?this.data.dishes:this.data.groups;if(!labels[id])return this.notFound();const rows=this.data.filter(Object.assign({},this.state,{status:'all',group:'',dish:'',q:'',hour:'',on:''}),{[key]:id}),params={[key]:id},other=key==='dish'?'group':'dish',list=this.data.breakdown(rows,other),t=this.data.totals(rows);const name=key==='dish'?labels[id]:'Класс '+labels[id];let table='<section class="panel"><div class="panel-head" style="padding-bottom:18px"><h2>'+(key==='dish'?'По классам и группам':'По блюдам')+'</h2></div><div class="table-wrap"><table><colgroup><col><col style="width:110px"><col style="width:110px"><col style="width:110px"></colgroup><thead><tr><th>'+(key==='dish'?'Класс / группа':'Блюдо')+'</th><th>Выдано</th><th>План</th><th>Осталось</th></tr></thead><tbody>'+list.map(r=>'<tr class="click-row" data-route="'+this.url(other+'/'+r.id)+'"><td><a class="row-title" href="'+this.url(other+'/'+r.id)+'">'+r.label+' <span class="arrow">›</span></a></td><td class="num">'+r.issued+'</td><td>'+r.planned+'</td><td>'+ (r.planned-r.issued)+'</td></tr>').join('')+'</tbody></table></div><div class="table-foot"><span>'+list.length+' '+(key==='dish'?'класса и группы':'блюда')+'</span><a class="panel-link" href="'+this.url('orders',params)+'">Все связанные заказы ›</a></div></section>';return this.back()+this.heading(name,key==='dish'?'Выдача блюда и связанные заказы':'Питание класса и связанные заказы')+this.metrics(rows,params)+'<div class="entity-layout"><div class="entity-main">'+table+'<section class="panel"><div class="panel-head" style="padding-bottom:18px"><h2>Заказы</h2><span class="fraction">'+rows.length+' записей</span></div>'+this.orderTable(rows,true)+'</section></div><aside class="side-stack"><section class="panel panel-body"><h2 class="sidebar-title">'+(key==='dish'?'Сведения о блюде':'Сведения о классе')+'</h2><dl class="properties"><div class="property"><dt>'+(key==='dish'?'Блюдо':'Класс / группа')+'</dt><dd>'+labels[id]+'</dd></div><div class="property"><dt>Период</dt><dd>'+(this.state.period==='week'?'13–19 октября 2026':this.date(this.state.date))+'</dd></div><div class="property"><dt>Готово заказов</dt><dd>'+t.ready+' из '+t.orders+'</dd></div><div class="property"><dt>Готовность плана</dt><dd>'+(t.planned?Math.round(t.issued/t.planned*100):0)+'%</dd></div></dl></section><section class="note-panel"><h3>Как считаются порции</h3><p>В выдачу входят заказы со статусом «Готово». Новые и готовящиеся заказы учитываются в плане.</p></section></aside></div>'+this.footnote();}
  order(id){const r=this.data.record(id);if(!r)return this.notFound();const accounted=r.status==='ready';const event=(title,desc,time,complete)=>'<li class="'+(complete?'complete':'')+'"><span class="timeline-dot">'+(complete?'✓':'○')+'</span><div><h3>'+title+'</h3><p>'+desc+'</p></div><span class="timeline-time">'+(time||'Ожидает')+'</span></li>';return this.back('К списку заказов','orders')+this.crumbs('Заказ #'+r.id)+'<div class="page-head"><div><h1 class="page-title">Заказ #'+r.id+'</h1><p class="subtitle">'+this.date(r.date)+' · добавлен в '+r.created+'</p></div>'+this.badge(r.status)+'</div><div class="entity-layout"><div class="entity-main"><section class="panel"><div class="panel-body"><h2 class="entity-name"><a href="'+this.url('dish/'+r.dish)+'">'+this.data.dishes[r.dish]+' <span class="arrow">›</span></a></h2><div class="entity-caption">Блюдо для класса или группы</div></div><div class="detail-summary" style="border-top:1px solid var(--border)"><div class="item"><span class="item-label">Количество</span><span class="item-value">'+this.portions(r.qty)+'</span></div><div class="item"><span class="item-label">Класс / группа</span><a class="item-value text-link" href="'+this.url('group/'+r.group)+'">'+this.data.groups[r.group]+'</a></div><div class="item"><span class="item-label">Статус</span>'+this.badge(r.status)+'</div><div class="item"><span class="item-label">Готово в</span><span class="item-value">'+(r.ready||'—')+'</span></div></div></section><section class="panel"><div class="panel-head"><h2>История заказа</h2></div><ol class="timeline">'+event('Заказ добавлен','Елена К. · '+this.portions(r.qty)+' для '+this.data.groups[r.group],r.created,true)+event('Приготовление начато',r.status==='new'?'Приготовление ещё не началось':'Повар начал готовить блюдо',r.cooking,r.status!=='new')+event('Блюдо готово',accounted?'Порции учтены в статистике выдачи':'Порции будут учтены после готовности',r.ready,accounted)+'</ol></section><section class="panel panel-body"><h2 class="sidebar-title">Связанные разделы</h2><div class="links-list"><a href="'+this.url('dish/'+r.dish)+'">Статистика блюда <span>›</span></a><a href="'+this.url('group/'+r.group)+'">Статистика класса '+this.data.groups[r.group]+' <span>›</span></a><a href="'+this.url('orders',{dish:r.dish,group:r.group})+'">Все заказы этого блюда для класса <span>›</span></a></div></section></div><aside class="side-stack"><section class="warm-panel"><div class="item-label" style="color:var(--warm-ink)">Учтено в выдаче</div><div class="large-quantity">'+(accounted?r.qty:0)+'</div><h3 style="margin:0;font-size:16px">порций</h3><p>'+(accounted?'Отметка «Готово» сохранена в '+r.ready+'.':'Порции будут учтены после отметки «Готово».')+'</p></section><section class="panel panel-body"><h2 class="sidebar-title">Данные заказа</h2><dl class="properties"><div class="property"><dt>Номер</dt><dd>#'+r.id+'</dd></div><div class="property"><dt>Повар</dt><dd>Елена К.</dd></div><div class="property"><dt>Дата</dt><dd>'+this.date(r.date)+'</dd></div><div class="property"><dt>Источник</dt><dd>Рабочее место повара</dd></div></dl></section></aside></div>'+this.footnote();}
  notFound(){return '<section class="panel empty"><h1>Раздел не найден</h1><p>Откройте общую статистику и выберите нужный блок.</p><a class="small-button" href="'+this.url('overview')+'">К статистике</a></section>';}
}
class AnalyticsApp {
  #data;#view;#root;#state;
  constructor(root){this.#data=new AnalyticsData();this.#view=new AnalyticsView(this.#data);this.#root=root;window.addEventListener('hashchange',()=>this.render());root.addEventListener('click',event=>this.onClick(event));root.addEventListener('change',event=>this.onChange(event));root.addEventListener('submit',event=>this.onSubmit(event));this.render();}
  parse(){const [path,query]=(location.hash.slice(1)||'/overview').split('?'),p=new URLSearchParams(query||'');const requested=p.get('date');return{path:path.replace(/^\/+/,'')||'overview',period:p.get('period')==='week'?'week':'day',date:/^2026-10-1[3-9]$/.test(requested||'')?requested:'2026-10-19',status:p.get('status')||'all',group:p.get('group')||'',dish:p.get('dish')||'',q:p.get('q')||'',hour:p.get('hour')||'',on:p.get('on')||'',sort:p.get('sort')||'',page:Math.max(1,parseInt(p.get('page')||'1',10)||1)};}
  render(){this.#state=this.parse();this.#root.innerHTML=this.#view.render(this.#state);document.title='Столовая — '+({overview:'Статистика',orders:'Заказы',dish:'Блюдо',group:'Класс',order:'Заказ'}[this.#state.path.split('/')[0]]||'Аналитика');window.scrollTo(0,0);}
  navigate(changes){const next=Object.assign({},this.#state,changes);delete next.path;location.hash=this.#view.url(this.#state.path,next);}
  onClick(event){const sort=event.target.closest('[data-sort]');if(sort){this.navigate({sort:sort.dataset.sort,page:1});return;}if(event.target.closest('a,button,input,select'))return;const row=event.target.closest('[data-route]');if(row)location.hash=row.dataset.route;}
  onChange(event){const field=event.target.closest('[data-filter]');if(field)this.navigate({[field.dataset.filter]:field.value,page:1});}
  onSubmit(event){if(event.target.id!=='search-form')return;event.preventDefault();this.navigate({q:new FormData(event.target).get('q').trim(),page:1});}
}
