<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">Как работает Столовая</title><desc id="desc">Заказ повара, отметка готовности и аналитика администратора связаны одной базой PostgreSQL.</desc><rect width="1200" height="260" rx="16" fill="#f6f5f4"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#111111"><rect x="40" y="36" width="340" height="188" rx="12" fill="#ffffff" stroke="#00000014"/><text x="64" y="73" font-size="18" fill="#757575">01</text><text x="64" y="113" font-size="29" font-weight="600">Повар</text><text x="64" y="154" font-size="22">Создаёт заказ</text><text x="64" y="190" font-size="19" fill="#615d59">Блюдо · класс · порции</text><path d="M391 130h27m-8-7 8 7-8 7" fill="none" stroke="#0075de" stroke-width="2"/><rect x="430" y="36" width="340" height="188" rx="12" fill="#fff1ce" stroke="#00000014"/><text x="454" y="73" font-size="18" fill="#757575">02</text><text x="454" y="113" font-size="29" font-weight="600">Готовность</text><text x="454" y="154" font-size="22">Отмечает «Готово»</text><text x="454" y="190" font-size="19" fill="#615d59">Порции входят в выдачу</text><path d="M781 130h27m-8-7 8 7-8 7" fill="none" stroke="#0075de" stroke-width="2"/><rect x="820" y="36" width="340" height="188" rx="12" fill="#ffffff" stroke="#00000014"/><text x="844" y="73" font-size="18" fill="#757575">03</text><text x="844" y="113" font-size="29" font-weight="600">Администратор</text><text x="844" y="154" font-size="22">Видит результат</text><text x="844" y="190" font-size="19" fill="#615d59">День · неделя · подробности</text></g></svg>
