<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">Столовая — учёт школьного питания</title><desc id="desc">Повар создаёт заказ для класса. Готовые порции попадают в аналитику администратора.</desc><rect width="1200" height="310" rx="16" fill="#f6f5f4"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#111111"><text x="56" y="58" font-size="18" letter-spacing="2" fill="#757575">ШКОЛЬНОЕ ПИТАНИЕ / ДВА РАБОЧИХ МЕСТА</text><text x="52" y="151" font-size="80" font-weight="600" letter-spacing="-3">Столовая</text><text x="56" y="201" font-size="26">От заказа для класса — к понятной статистике.</text><rect x="56" y="237" width="174" height="36" rx="8" fill="#e6f3fe"/><text x="75" y="262" font-size="19" fill="#0075de">Next.js + NestJS</text><text x="252" y="262" font-size="19" fill="#757575">PostgreSQL · TypeScript · MIT</text><rect x="840" y="80" width="304" height="174" rx="12" fill="#fff1ce"/><text x="868" y="119" font-size="20" fill="#826018">Новый → Готовится</text><text x="865" y="183" font-size="45" font-weight="600">Готово</text><text x="868" y="220" font-size="20" fill="#826018">Порции учтены в выдаче</text></g></svg>
